<style>
:root{--navy:#0F172A;--accent:#FF6B35;--bg:#FAFAFA;--text:#1E293B;--muted:#64748B;

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
a{color:var(--accent);text-decoration:none}
header{background:var(--navy);color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;position:sticky;top:0;z-index:50}
header h1{font-size:1.05rem;font-weight:700}
header .gen{font-size:.72rem;color:#94A3B8;margin-left:auto}
nav{display:flex;gap:.35rem;flex-wrap:wrap;width:100%}
nav button{background:rgba(255,255,255,.07);color:#cbd5e1;border:1px solid rgba(255,255,255,.09);padding:.42rem .95rem;border-radius:99px;font-size:.8rem;font-weight:600;cursor:pointer}
nav button:hover{background:rgba(255,255,255,.14)}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:1240px;margin:0 auto;padding:1.4rem 1.2rem 4rem}
section.tab{display:none}
section.tab.on{display:block}
.grid{display:grid;gap:1rem}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.2rem}
.card h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:.7rem}
.kpi{font-size:2rem;font-weight:800;color:var(--navy);line-height:1.1}
.kpi small{font-size:.8rem;font-weight:600;color:var(--muted)}
.kpisub{font-size:.78rem;color:var(--muted);margin-top:.25rem}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.45rem;vertical-align:1px}
.dot.run{background:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.18);animation:pulse 1.6s infinite}
.dot.idle{background:#94A3B8}
.dot.stale{background:var(--amber)}
.dot.paper{background:transparent;border:2px dashed var(--red)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(22,163,74,.05)}}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;padding:.45rem .6rem;border-bottom:2px solid var(--border)}
td{padding:.5rem .6rem;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:.14rem .6rem;border-radius:99px;font-size:.7rem;font-weight:700}
.pill.ok{background:#dcfce7;color:#166534}
.pill.warn{background:#fef3c7;color:#92400e}
.pill.bad{background:#fee2e2;color:#991b1b}
.pill.info{background:#e0e7ff;color:#3730a3}
.pill.neutral{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.pill.claim{background:#f3e8ff;color:#5b21b6}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1rem}
.teamhead{display:flex;align-items:center;gap:.5rem;font-weight:800;color:var(--navy);margin-bottom:.35rem}
.teamhead .bar{flex:1;height:3px;border-radius:2px;background:var(--border)}
.agent{border:1px solid var(--border);border-radius:10px;padding:.6rem .75rem;margin-bottom:.5rem;background:#fff;cursor:pointer;transition:box-shadow .15s}
.agent:hover{box-shadow:0 3px 12px rgba(15,23,42,.08)}
.agent .nm{font-weight:700;font-size:.85rem;color:var(--navy)}
.agent .mt{font-size:.72rem;color:var(--muted);margin-top:.15rem;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.trigs{margin-top:.35rem;display:flex;flex-wrap:wrap;gap:.3rem}
.chip{background:var(--surface);border:1px solid var(--border);color:#475569;border-radius:6px;font-size:.63rem;padding:.28rem .5rem;font-weight:600}
.panel{border:1px solid var(--border);border-radius:10px;padding:.7rem .8rem;margin-top:1rem;background:var(--surface)}
.panel h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.4rem}
.panel .flex{display:flex;flex-wrap:wrap;gap:.35rem}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:3rem 1rem;overflow:auto}
.modal.on{display:flex}
.modal .inner{background:#fff;border-radius:16px;max-width:780px;width:100%;padding:1.6rem;position:relative}
.modal .x{position:absolute;top:.8rem;right:1rem;border:none;background:var(--surface);width:30px;height:30px;border-radius:8px;font-size:1rem;cursor:pointer;color:var(--muted)}
.wl{border-left:3px solid var(--border);padding:.15rem 0 .15rem .9rem;margin:.7rem 0;position:relative}
.wl::before{content:"";position:absolute;left:-6.5px;top:.55rem;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.wl .t{font-size:.72rem;color:var(--muted);font-weight:700}
.wl .h{font-weight:700;color:var(--navy);font-size:.9rem;margin:.1rem 0}
.wl .d{font-size:.8rem;color:#475569}
.bar-row{display:flex;align-items:center;gap:.6rem;margin:.32rem 0;font-size:.78rem}
.bar-row .lbl{width:120px;color:var(--muted);flex-shrink:0}
.bar-row .trk{flex:1;height:16px;background:var(--surface);border-radius:4px;overflow:hidden}
.bar-row .fill{height:100%;border-radius:4px}
.bar-row .val{width:60px;text-align:right;font-weight:700;color:var(--navy)}
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;align-items:start}
.kcol h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.6rem}
.job{border:1px solid var(--border);border-radius:10px;background:#fff;padding:.6rem .75rem;margin-bottom:.5rem;font-size:.78rem}
.job .jid{font-family:monospace;font-size:.66rem;color:var(--muted)}
.job .js{margin:.25rem 0;font-weight:600;color:var(--navy)}
.empty{color:var(--muted);font-size:.8rem;font-style:italic;padding:1rem 0}
.issues li{margin:.4rem 0 .4rem 1.1rem;font-size:.85rem}
.foot{text-align:center;color:var(--muted);font-size:.72rem;margin-top:2rem}
.scroll{max-height:420px;overflow:auto}
.search{border-radius:10px !important}
@media(max-width:700px){.g2{grid-template-columns:1fr}}
</style>

const esc = s => String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (q, p) => (p || document).querySelector(q);
const $$ = (q, p) => (p || document).querySelectorAll(q);
const TABS = [["overview","Overview"],["org","Org"],["paperclip","Paperclip"],["pipeline","Pipeline"],["seo","SEO Ops"],["ledger","Ledger"],["integrity","Integrity"]];
const teams = ["SEO","Social","Design","Coding"];
const humanizers = DATA.agents.filter(x=>x.humanizer).map(x=>x.name);

function nav() {
  $("#nav").innerHTML = TABS.map(function(t,i){
    return '<button class="'+(i===0?'on':'')+'" onclick="go(\''+t[0]+'\',this)">'+t[1]+'</button>';
  }).join("");
  $("#gen").textContent = DATA.generated_at ? "data " + DATA.generated_at.replace("T"," ") + " UTC" : "no data";
  var la = DATA.agents.filter(function(x){return x.live.state==="running";});
  document.title = la.length ? ("\u26A1 " + la.length + " running \u00B7 FLIGHKO OPS") : "FLIGHKO OPS";
}
function go(k,btn) {
  $$("nav button").forEach(function(b){b.classList.remove("on");});
  btn.classList.add("on");
  $$("section.tab").forEach(function(s){s.classList.remove("on");});
  $("#tab-"+k).classList.add("on");
}
function liveDot(x) {
  if(x.never_ran) return '<span class="dot paper"></span>';
  if(x.live.state==="running") return '<span class="dot run"></span>';
  return (x.last_date && x.stale) ? '<span class="dot stale"></span>' : '<span class="dot idle"></span>';
}
function agoH(h) {
  if(h===null||h===undefined) return "never";
  if(h<1) return "just now";
  if(h<24) return Math.round(h)+"h ago";
  return Math.round(h/24)+"d ago";
}
function barRow(label,v,total,color) {
  var pct = total ? (100*v/total).toFixed(1)+"%" : "\u2014";
  var w = total ? (100*v/total) : 0;
  return '<div class="bar-row"><span class="lbl">'+esc(label)+'</div><div class="trk"><div class="fill" style="width:'+w+'%;background:'+color+'"></div></div><span class="val">'+v+' \u00B7 '+pct+'</span></div>';
}
function kpi(big,label,sub,sub2) {
  var s = '<div class="card"><div class="kpi">'+big+'</div><div style="font-weight:700;font-size:.85rem;color:var(--navy)">'+esc(label)+'</div><div class="kpisub">'+esc(sub||'');
  if(sub2) s += '<br>'+esc(sub2);
  return s+'</div></div>';
}

function renderOverview() {
  var seo = DATA.seo.trend.length ? DATA.seo.trend[DATA.seo.trend.length-1] : null;
  var jobs = 0, inflight = 0;
  DATA.agents.forEach(function(x){ jobs += x.jobs.length; });
  DATA.agents.forEach(function(x){ x.jobs.forEach(function(j){ if(["done","error"].indexOf(j.status)<0) inflight++; }); });
  var run = DATA.agents.filter(function(x){return x.live.state==="running";}).length;
  var nph = DATA.agents.filter(function(x){return x.never_ran;}).length;
  var staleN = DATA.agents.filter(function(x){return !x.never_ran && x.stale;}).length;
  var open_t = DATA.tasks.filter(function(t){return t.status.toLowerCase().indexOf("done")<0;}).length;
  var h = '<div class="grid g4" style="margin-bottom:1.2rem">';
  h += kpi(seo ? seo.indexed+'<small>/'+seo.total+'</small>' : "\u2014", "Indexed pages",
    seo ? "("+(100*seo.indexed/seo.total).toFixed(0)+"%) vs baseline 168" : "no audit",
    seo ? "re-audit +7d pending" : "");
  h += kpi(run+"/"+DATA.agents.length, "Agents live (heartbeat)", nph+" spec-only \u00B7 "+staleN+" stale", "humanizer gate: "+humanizers.length+" agents");
  h += kpi(inflight, "Agent jobs open", jobs+" total inboxes", "open tasks: "+open_t);
  h += kpi(DATA.cron.length, "Cron jobs", DATA.cron.length ? "scheduled in hermes" : "", "submitted URLs: "+DATA.seo.submitted_count);
  h += '</div><div class="grid g2">';
  h += '<div class="card"><h3>Teams</h3><div class="teamgrid">';
  teams.forEach(function(t){
    var members = DATA.agents.filter(function(x){return x.team===t;});
    h += '<div><div class="teamhead">'+t+'<span class="bar"></span><span style="font-size:.72rem;color:var(--muted)">'+members.length+'</span></div>';
    members.slice(0,7).forEach(function(m){
      h += '<div style="font-size:.8rem;padding:.18rem 0">'+liveDot(m)+esc(m.name)+' <span style="color:var(--muted);font-size:.72rem">'+agoH(m.age_h)+'</span>'+(m.humanizer?' <span class="pill claim" title="humanizer pass required">Hz</span>':'')+'</div>';
    });
    if(members.length>7) h += '<div style="font-size:.7rem;color:var(--muted)">+'+(members.length-7)+' more</div>';
    h += '</div>';
  });
  h += '</div></div>';
  var done=['P1','P2','P3','P4','P5','P6','P7','P8'];
  h += '<div class="card"><h3>T030 Structure Rebuild</h3>';
  DATA.phases.forEach(function(p){
    var d2 = done.indexOf(p.id.trim())>=0;
    h += '<div class="bar-row"><span class="lbl">'+esc(p.id)+'</div><div class="trk"><div class="fill" style="width:'+(d2?'100%':'8%')+';background:'+(d2?'var(--green)':'var(--border)')+'"></div></div><span class="val">'+(d2?'done':'pending')+'</span></div>';
    h += '<div style="font-size:.71rem;color:var(--muted);margin:-.1rem 0 .4rem 130px">'+esc(p.what.slice(0,110))+'</div>';
  });
  h += '<div style="margin-top:.5rem;font-size:.78rem">orbits: 104\u21920 \u00B7 sitemap 451\u2192554 \u00B7 link_coverage.py PASS</div></div>';
  h += '<div class="card" style="margin-top:1rem"><h3>Latest ship events</h3><table>';
  DATA.site_commits.forEach(function(c){
    h += '<tr><td style="white-space:nowrap;font-family:monospace;font-size:.72rem">'+esc(c.hash)+' '+esc(c.date)+'</td><td>'+esc(c.msg.slice(0,90))+'</td></tr>';
  });
  h += '</table></div></div>';
  return h;
}

function renderOrg() {
  var h = '<input class="search" placeholder="filter agents\u2026" oninput="filterOrg(this.value)" style="width:100%;padding:.6rem .9rem;border:1px solid var(--border);border-radius:10px;font-size:.85rem;margin-bottom:1rem;background:#fff">';
  teams.forEach(function(t){
    var members = DATA.agents.filter(function(a){return a.team===t;});
    h += '<div class="card" style="margin-bottom:1rem"><div class="teamhead" style="font-size:1rem">'+t+' Team <span class="bar"></span><span style="font-size:.72rem;color:var(--muted)">'+members.length+'</span></div><div class="teamgrid">';
    members.forEach(function(m){
      var chips = m.triggers.slice(0,4).map(function(t){return '<span class="chip">\u26A1 '+esc(t)+'</span>';}).join("")
        + (m.humanizer ? '<span class="chip">\uD83D\uDC68\u200D\uD83C\uDFA8 humanizer</span>' : "");
      h += '<div class="agent" data-nm="'+esc((m.name+" "+m.folder).toLowerCase())+'" onclick="openAgent(\''+esc(m.folder)+'\')">';
      h += '<div class="nm">'+liveDot(m)+esc(m.name)+'</div>';
      h += '<div class="mt"><span>\uD83D\uDCCB '+m.wl_count+'</span><span>\uD83D\uDCE5 '+m.jobs.length+'</span></div>';
      if(chips) h += '<div class="trigs">'+chips+'</div>';
      h += '</div>';
    });
    h += '</div></div>';
  });
  return h;
}
function filterOrg(q) {
  q=q.toLowerCase();
  $$(".agent").forEach(function(el){el.style.display = el.dataset.nm.indexOf(q)>=0 ? "" : "none";});
}

function openAgent(folder) {
  var m = null;
  for(var i=0;i<DATA.agents.length;i++){ if(DATA.agents[i].folder===folder){ m=DATA.agents[i]; break; } }
  if(!m) return;
  var h = '<h2 style="color:var(--navy);margin-bottom:.3rem">'+esc(m.name)+'</h2>';
  h += '<div style="color:var(--muted);font-size:.8rem;margin-bottom:1.1rem">'+esc(m.team)+' team \u00B7 <code style="font-size:.7rem">'+esc(m.team_key)+'/agents/'+esc(m.folder)+'</code> \u00B7 state: '+esc(m.live.state)+'</div>';

  h += '<div class="panel"><h4>\uD83D\uDEE0 Skills ('+m.skills.length+')</h4><div class="flex">';
  if(m.skills.length){ m.skills.forEach(function(s){ h += '<span class="pill info">'+esc(s)+'</span>'; }); }
  else { h += '<span style="color:var(--muted);font-size:.78rem">none in agent.md frontmatter</span>'; }
  h += '</div></div>';

  h += '<div class="panel"><h4>\u26A1 Triggers ('+m.triggers.length+')</h4><div class="flex">';
  m.triggers.forEach(function(t){ h += '<span class="chip">'+esc(t)+'</span>'; });
  if(!m.triggers.length) h += '<span style="color:var(--muted);font-size:.78rem">none</span>';
  h += '</div></div>';

  h += '<div class="panel"><h4>\uD83C\uDFAF Handoffs</h4><div class="flex">';
  m.handoff_to.forEach(function(t){ h += '<span class="pill neutral">\u2192 '+esc(t)+'</span>'; });
  m.handoff_from.forEach(function(t){ h += '<span class="pill neutral">\u2190 '+esc(t)+'</span>'; });
  if(!m.handoff_to.length && !m.handoff_from.length) h += '<span style="color:var(--muted);font-size:.78rem">none</span>';
  h += '</div></div>';

  var repos = m.repos || [];
  h += '<div class="panel"><h4>\uD83E\uDDF0 Repos ('+repos.length+')</h4><div class="flex">';
  repos.forEach(function(r){ h += '<span class="chip">'+esc(r)+'</span>'; });
  if(!repos.length) h += '<span style="color:var(--muted);font-size:.78rem">none listed</span>';
  h += '</div></div>';

  h += '<div class="panel"><h4>\u2705 Humanizer gate</h4><div class="flex">';
  h += (m.humanizer ? '<span class="pill ok">humanizer pass required</span>' : '<span class="pill neutral">not referenced</span>');
  h += '</div></div>';

  if(m.inputs.length||m.outputs.length) {
    h += '<div class="panel"><h4>\uD83D\uDCE5 Inputs / \uD83D\uDCE4 Outputs</h4>';
    h += '<div style="font-size:.75rem;color:#475569"><b>In:</b> '+esc(m.inputs.join(", "))+'<br><b>Out:</b> '+esc(m.outputs.join(", "))+'</div></div>';
  }

  h += '<h3 style="font-size:.75rem;text-transform:uppercase;color:var(--muted);letter-spacing:.07em;margin-top:1.2rem">Worklog ('+m.wl_count+')</h3>';
  if(!m.worklog.length) h += '<div class="empty">No worklog entries \u2014 spec-only.</div>';
  m.worklog.slice().reverse().forEach(function(w){
    var st = /done/.test(w.status)?"ok":(/progress/.test(w.status)?"info":"neutral");
    h += '<div class="wl"><div class="t">'+esc(w.date)+' '+esc(w.time||"")+' <span class="pill '+st+'">'+esc(w.status)+'</span></div><div class="h">'+esc(w.title)+'</div><div class="d">'+esc(w.detail)+'</div></div>';
  });
  if(m.jobs.length) {
    h += '<h3 style="font-size:.75rem;text-transform:uppercase;color:var(--muted);letter-spacing:.07em;margin-top:1.2rem">Job inbox ('+m.jobs.length+')</h3>';
    m.jobs.forEach(function(j){
      var jc = j.status==="in-progress"?"info":(j.status==="error"?"bad":"neutral");
      h += '<div class="job"><span class="pill '+jc+'">'+esc(j.status)+'</span> <b>'+esc(j.summary.slice(0,130))+'</b><div class="jid">'+esc(j.id)+' \u00B7 from '+esc(j.from||"?")+' \u00B7 '+esc(j.created)+'</div></div>';
    });
  }
  if(m.commits.length) {
    h += '<h3 style="font-size:.75rem;text-transform:uppercase;color:var(--muted);letter-spacing:.07em;margin-top:1.2rem">Commits in this agent\'s folders</h3><table>';
    m.commits.forEach(function(c){
      h += '<tr><td style="white-space:nowrap;font-family:monospace;font-size:.7rem">'+esc(c.hash)+' '+esc(c.date)+' <span class="pill neutral">'+esc(c.repo)+'</span></td><td>'+esc(c.msg.slice(0,90))+'</td></tr>';
    });
    h += '</table>';
  }
  $("#mbody").innerHTML = h;
  $("#modal").classList.add("on");
}
function closeModal(){ $("#modal").classList.remove("on"); }
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();});
$("#modal").addEventListener("click",function(e){if(e.target.id==="modal")closeModal();});

function renderPipeline() {
  var allJobs = [];
  DATA.agents.forEach(function(a){ a.jobs.forEach(function(j){ allJobs.push(Object.assign({},j,{agent:a.name,team:a.team})); }); });
  var cols=[["queued","Queued","neutral"],["in-progress","In progress","info"],["done","Done","ok"],["error","Errors","bad"]];
  var h = '<p style="color:var(--muted);font-size:.8rem;margin-bottom:1rem">'+allJobs.length+' messages routed via message_bus \u2192 agent jobs/ inboxes.</p><div class="kanban">';
  cols.forEach(function(col){
    var st=col[0],label=col[1],cls=col[2];
    var items = allJobs.filter(function(j){return j.status===st;});
    h += '<div class="kcol"><h4>'+label+' <span class="pill '+cls+'">'+items.length+'</span></h4>';
    if(!items.length) h += '<div class="empty">\u2014</div>';
    items.forEach(function(j){
      h += '<div class="job"><span class="pill neutral">'+esc(j.team)+'</span> <b>'+esc(j.agent)+'</b><div class="js">'+esc(j.summary.slice(0,140))+'</div><div class="jid">'+esc(j.id)+' \u00B7 '+esc(j.created)+'</div></div>';
    });
    h += '</div>';
  });
  h += '</div>';
  h += '<div class="card" style="margin-top:1rem"><h3>Scheduled crons (hermes jobs.json)</h3><table><tr><th>job</th><th>schedule</th><th>next run</th><th>last</th></tr>';
  DATA.cron.forEach(function(c){
    var lastPill = c.last_status ? '<span class="pill '+(c.last_status==="ok"?"ok":"bad")+'">'+esc(c.last_status)+'</span>' : '<span class="pill neutral">\u2014</span>';
    h += '<tr><td><b>'+esc(c.name)+'</b><br><span class="jid">'+esc(c.id)+'</span></td><td style="font-size:.75rem">'+esc(c.schedule)+'</td><td style="white-space:nowrap">'+esc(c.next||"\u2014")+'</td><td>'+lastPill+'</td></tr>';
  });
  h += '</table></div>';
  return h;
}

function renderSeo() {
  var t = DATA.seo.trend;
  var h = '<div class="grid g2">';
  h += '<div class="card"><h3>Coverage trend (GSC URL Inspection)</h3>';
  if(!t.length) h += '<div class="empty">No audit files found in flighko-next/gsc-reports/.</div>';
  t.forEach(function(p){
    h += '<div style="margin-bottom:1rem"><b style="font-size:.8rem">'+p.date.slice(4,6)+'/'+p.date.slice(6,8)+'/'+p.date.slice(0,4)+'</b> \u00B7 '+p.total+' URLs inspected<br>';
    h += barRow("indexed",p.indexed,p.total,"var(--green)");
    h += barRow("unknown",p.unknown,p.total,"#94A3B8");
    h += barRow("discovered",p.discovered,p.total,"var(--amber)")+'</div>';
  });
  if(t.length){
    var first=t[0], last=t[t.length-1];
    var delta = last.indexed-first.indexed;
    h += '<div style="font-size:.75rem;color:var(--muted)">Delta: <b style="color:'+(delta>=0?'var(--green)':'var(--red)')+'">+'+delta+'</b> indexed ('+first.indexed+' \u2192 '+last.indexed+'). Re-audit cron adds new points automatically.</div>';
  } else {
    h += '<div style="font-size:.75rem;color:var(--muted)">Place gsc-index-audit-*.json in flighko-next/gsc-reports/ and this chart grows.</div>';
  }
  h += '</div>';
  h += '<div class="card"><h3>Indexing API pushes</h3><div class="kpi" style="font-size:1.6rem">'+DATA.seo.submitted_count+'</div><div class="kpisub">URLs pushed \u00B7 orphan baseline '+DATA.seo.orphan_baseline+'\u21920</div>';
  h += '<div class="scroll"><table>';
  DATA.seo.submitted.slice().reverse().forEach(function(u){
    h += '<tr><td style="font-size:.72rem;word-break:break-all">'+esc(u.replace("https://www.flighko.com",""))+'</td></tr>';
  });
  h += '</table></div></div></div>';
  return h;
}

function renderPaperclip() {
  var PC = DATA.paperclip || {issues:[],runs:[],agents:[],down:true,enabled:false};
  var h = "";
  if(!PC.enabled){
    h += '<div class="card" style="border:1px solid #fca5a5"><h3 style="color:var(--red)">\\u26A0\\uFE0F Paperclip server unreachable</h3>';
    h += '<div style="font-size:.78rem">'+esc(PC.server||"")+' \\u2014 '+(esc(PC.error||"not synced"))+'</div>';
    h += '<div style="font-size:.72rem;color:var(--muted);margin-top:.4rem">Start it: <code>paperclip-trial\\start-paperclip.bat</code> (autostarts at logon)</div></div>';
    return h;
  }
  var runN = PC.agents.filter(function(a){return a.status==="running";}).length;
  var hbOn = PC.agents.filter(function(a){return a.heartbeat_on;}).length;
  var spent = (PC.spent_cents!==undefined? PC.spent_cents : PC.agents.reduce(function(s,a){return s+(a.spent_cents||0);},0));
  h += '<div class="grid g4" style="margin-bottom:1.2rem">';
  h += kpi(PC.agents.length, "Paperclip employees", runN+" running \\u00B7 "+hbOn+" on heartbeat", "company: "+esc(PC.company));
  h += kpi(PC.open_issues+" open", "Issues (FLI\\u2026)", PC.done_issues+" done/closed", "assign, gate, audit in Paperclip");
  h += kpi("$"+(spent/100).toFixed(2), "Spend this month", (PC.budget_cents? "$"+(PC.budget_cents/100).toFixed(0)+" cap" : "no company cap"), "hermes_local cost events still $0 \\u2014 see Integrity");
  var okRuns = PC.runs.filter(function(r){return r.status==="succeeded";}).length;
  var badRuns = PC.runs.filter(function(r){return r.status==="failed";}).length;
  h += kpi(PC.runs.length, "Heartbeat runs (recent)", okRuns+" succeeded \\u00B7 "+badRuns+" failed", "last: "+esc(PC.runs.length?PC.runs[0].agent:"\\u2014"));
  h += '</div><div class="grid g2">';
  h += '<div class="card"><h3>Employees ('+PC.agents.length+')</h3><table><tr><th>Name</th><th>Role</th><th>Status</th><th>Heartbeat</th><th>Budget</th></tr>';
  PC.agents.forEach(function(a){
    var st = a.status==="running"?'<span class="pill ok">running</span>':(a.status==="paused"?'<span class="pill warn">paused</span>':(a.status==="error"?'<span class="pill bad">error</span>':'<span class="pill info">'+esc(a.status)+'</span>'));
    h += '<tr><td><b>'+esc(a.name)+'</b></td><td>'+esc(a.role)+'</td><td>'+st+'</td><td>'+(a.heartbeat_on?'<span class="pill ok">on</span>':'<span class="pill neutral">off</span>')+'</td><td style="font-size:.72rem">$'+(a.budget_cents/100).toFixed(0)+'/mo</td></tr>';
  });
  h += '</table><div style="font-size:.7rem;color:var(--muted);margin-top:.4rem">Each points at its v2-brain agent.md \\u2014 edit brains there.</div></div>';
  h += '<div class="card"><h3>Recent heartbeat runs</h3><table><tr><th>Agent</th><th>Status</th><th>Source</th><th>Started</th></tr>';
  if(!PC.runs.length) h += '<tr><td colspan="4" style="color:var(--muted)">no runs yet</td></tr>';
  PC.runs.forEach(function(r){
    var st = r.status==="succeeded"?'<span class="pill ok">ok</span>':(r.status==="running"?'<span class="pill ok">running</span>':(r.status==="failed"?'<span class="pill bad">failed</span>':'<span class="pill neutral">'+esc(r.status)+'</span>'));
    h += '<tr><td>'+esc(r.agent)+'</td><td>'+st+'</td><td style="font-size:.7rem">'+esc(r.source)+'</td><td style="font-size:.7rem;color:var(--muted)">'+esc(r.started)+'</td></tr>';
  });
  h += '</table></div></div>';
  h += '<div class="card" style="margin-top:1rem"><h3>Issue board</h3><table><tr><th>ID</th><th>Title</th><th>Status</th><th>Priority</th><th>Assignee</th></tr>';
  if(!PC.issues.length) h += '<tr><td colspan="5" style="color:var(--muted)">no issues on the board</td></tr>';
  PC.issues.forEach(function(i){
    var s = i.status; var cls = (s==="done"||s==="closed")?"ok":((s==="blocked"||s==="cancelled")?"bad":((s==="in_progress"||s==="running")?"info":"neutral"));
    h += '<tr><td><b>'+esc(i.id)+'</b></td><td>'+esc(i.title)+'</td><td><span class="pill '+cls+'">'+esc(s)+'</span></td><td style="font-size:.72rem">'+esc(i.priority)+'</td><td style="font-size:.72rem">'+esc(i.assignee)+'</td></tr>';
  });
  h += '</table><div style="font-size:.7rem;color:var(--muted);margin-top:.4rem">Board UI: '+esc(PC.server||"").replace("/api","")+' \\u00B7 file-jobs dispatcher still live until crons migrate</div></div>';
  return h;
}

function renderLedger() {
  var h = '<div class="card"><h3>Task ledger (_hub/TASKS.md)</h3><table><tr><th>ID</th><th>Task</th><th>Status</th><th>Next</th><th>Gate</th></tr>';
  DATA.tasks.forEach(function(t){
    var s = /done/i.test(t.status)?"ok":(/progress/i.test(t.status)?"info":"neutral");
    h += '<tr><td><b>'+esc(t.id)+'</b></td><td>'+esc(t.task)+'</td><td><span class="pill '+s+'">'+esc(t.status)+'</span></td><td style="font-size:.72rem">'+esc(t.next.slice(0,120))+'</td><td style="font-size:.68rem;color:var(--muted)">'+esc(t.gate)+'</td></tr>';
  });
  h += '</table></div>';
  h += '<div class="card" style="margin-top:1rem"><h3>T030 blueprint phases</h3><table><tr><th>Phase</th><th>What</th><th>Files</th><th>Gate</th></tr>';
  DATA.phases.forEach(function(p){
    h += '<tr><td><b>'+esc(p.id)+'</b></td><td>'+esc(p.what)+'</td><td style="font-size:.68rem;font-family:monospace">'+esc(p.files)+'</td><td style="font-size:.68rem;color:var(--muted)">'+esc(p.gate)+'</td></tr>';
  });
  h += '</table></div>';
  return h;
}

function renderIntegrity(){
  var h = '<div class="grid g2">';
  h += '<div class="card"><h3>Automated checks</h3><ul class="issues">';
  h += '<li>Disk agent folders: <b>'+DATA.agents.length+'</b> vs dispatcher roster <b>17</b> \u2014 '+(DATA.agents.length===17?'<span class="pill ok">match</span>':'<span class="pill bad">mismatch</span>')+'</li>';
  h += '<li>Heartbeat-sent: <b>'+DATA.agents.filter(function(x){return x.live.task||x.live.since;}).length+'</b> of '+DATA.agents.length+' agents</li>';
  h += '<li>Humanizer gate used: <b>'+humanizers.length+'</b> agents \u2014 '+esc(humanizers.join(", "))+'</li>';
  h += '</ul></div>';
  h += '<div class="card"><h3>Agent readiness</h3><table><tr><th>Agent</th><th>Spec</th><th>Worklog</th><th>Skills</th><th>Jobs</th><th>Activity</th><th>State</th></tr>';
  DATA.agents.forEach(function(m){
    var st = m.never_ran?"<span class='pill warn'>spec-only</span>":(m.live.state==="running"?'<span class="pill ok">running</span>':(m.stale?'<span class="pill warn">stale</span>':'<span class="pill info">active</span>'));
    h += '<tr><td><b>'+esc(m.name)+'</b><br><span style="font-size:.68rem;color:var(--muted)">'+esc(m.folder)+'</span></td>';
    h += '<td>'+(m.spec>0?'<span class="pill ok">\u2713</span>':'<span class="pill bad">\u2717</span>')+'</td>';
    h += '<td>'+m.wl_count+'</td>';
    h += '<td style="font-size:.68rem">'+(m.skills.length ? m.skills.length+' skills' : '<span class="pill neutral">none</span>')+(m.humanizer?' <span class="pill claim">Hz</span>':'')+'</td>';
    h += '<td>'+m.jobs.length+'</td>';
    h += '<td>'+agoH(m.age_h)+'</td><td>'+st+'</td></tr>';
  });
  h += '</table></div></div>';
  if(DATA.integrity.length) {
    h += '<div class="card" style="margin-top:1rem;border:1px solid #fca5a5"><h3 style="color:var(--red)">\u26A0\uFE0F Flags</h3><ul class="issues">';
    DATA.integrity.forEach(function(i){ h += '<li>'+esc(i)+'</li>'; });
    h += '</ul></div>';
  }
  return h;
}

var R = {overview:renderOverview,org:renderOrg,paperclip:renderPaperclip,pipeline:renderPipeline,seo:renderSeo,ledger:renderLedger,integrity:renderIntegrity};
nav();
Object.keys(R).forEach(function(k){ $("#tab-"+k).innerHTML = R[k](); });
</script>
